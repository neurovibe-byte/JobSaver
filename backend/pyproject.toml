[project]
name = "jobsaver-backend"
version = "0.1.0"
description = "JobSaver backend: AI workplace-safety monitoring API (FastAPI + YOLO)"
requires-python = ">=3.12"
dependencies = [
    "bcrypt>=5.0.0",
    "email-validator>=2.4.0",
    "fastapi>=0.163.1",
    "httpx>=0.28.1",
    "huggingface-hub>=2.4.0",
    "opencv-python-headless>=5.0.0.93",
    "pydantic-settings>=2.16.3",
    "pyjwt>=2.15.1",
    "python-multipart>=0.0.33",
    "sqlmodel>=0.0.50",
    "ultralytics>=8.4.213",
    "uvicorn[standard]>=0.54.0",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI dependency markers are meant to be used as argument defaults
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.File", "fastapi.Form"]
